<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진로 학습지</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); padding: 40px; }
        h1 { color: #333; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #555; font-weight: 600; margin-bottom: 8px; }
        input, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 14px; }
        input:focus, textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        textarea { resize: vertical; min-height: 80px; }
        .button-group { display: flex; gap: 10px; margin-top: 30px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-submit { background: #667eea; color: white; }
        .btn-submit:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .btn-admin { background: #764ba2; color: white; }
        .btn-admin:hover { background: #663a8a; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4); }
        .success-message { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; text-align: center; font-weight: 600; }
        .error-message { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; text-align: center; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 진로 학습지</h1>

        <div id="studentForm">
            <div class="form-group">
                <label>학번 *</label>
                <input type="text" id="studentId" placeholder="예: 2024001" required>
            </div>
            <div class="form-group">
                <label>이름 *</label>
                <input type="text" id="studentName" placeholder="예: 김철수" required>
            </div>
            <div class="form-group">
                <label>관심 분야 *</label>
                <input type="text" id="interest" placeholder="예: 인공지능, 프로그래밍" required>
            </div>
            <div class="form-group">
                <label>계기 *</label>
                <textarea id="trigger" placeholder="이 분야에 관심을 갖게 된 계기를 작성해주세요." required></textarea>
            </div>
            <div class="form-group">
                <label>탐색 활동 *</label>
                <textarea id="activity" placeholder="이 분야를 탐색하기 위해 어떤 활동을 했는지 작성해주세요." required></textarea>
            </div>
            <div class="form-group">
                <label>배운 점 *</label>
                <textarea id="learned" placeholder="활동을 통해 배운 점을 작성해주세요." required></textarea>
            </div>
            <div class="form-group">
                <label>느낀 점 *</label>
                <textarea id="felt" placeholder="활동을 통해 느낀 점을 작성해주세요." required></textarea>
            </div>

            <div class="button-group">
                <button class="btn-submit" onclick="submitForm()">✓ 제출</button>
                <button class="btn-admin" onclick="goToAdmin()">🔐 관리자</button>
            </div>

            <div class="success-message" id="successMessage">✅ 제출 완료되었습니다!</div>
            <div class="error-message" id="errorMessage"></div>
        </div>
    </div>

    <script>
        // 페이지 로드 시 제출 상태 확인
        window.addEventListener('load', function() {
            const isSubmitted = localStorage.getItem('formSubmitted');
            if (isSubmitted === 'true') {
                document.getElementById('studentForm').innerHTML = '<div style="text-align: center; padding: 40px;"><h2 style="color: #667eea; margin-bottom: 20px;">✅ 제출 완료</h2><p style="color: #666; font-size: 16px; margin-bottom: 20px;">귀하의 진로 학습지가 성공적으로 제출되었습니다.</p><button class="btn-admin" style="width: 200px; padding: 12px; background: #764ba2; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;" onclick="goToAdmin()">🔐 관리자 페이지</button></div>';
            }
        });

        function submitForm() {
            const studentId = document.getElementById('studentId').value.trim();
            const studentName = document.getElementById('studentName').value.trim();
            const interest = document.getElementById('interest').value.trim();
            const trigger = document.getElementById('trigger').value.trim();
            const activity = document.getElementById('activity').value.trim();
            const learned = document.getElementById('learned').value.trim();
            const felt = document.getElementById('felt').value.trim();

            if (!studentId || !studentName || !interest || !trigger || !activity || !learned || !felt) {
                document.getElementById('errorMessage').textContent = '⚠️ 모든 항목을 입력해주세요!';
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }

            const data = {
                studentId,
                studentName,
                interest,
                trigger,
                activity,
                learned,
                felt,
                generatedText: `나는 ${interest}에 관심이 있어서, ${trigger}를 계기로 ${activity}를 했다. 이 과정에서 ${learned}를 배웠고, ${felt}를 느꼈다.`,
                submittedAt: new Date().toLocaleString('ko-KR')
            };

            let submissions = JSON.parse(localStorage.getItem('submissions') || '{}');
            submissions[studentId] = data;
            localStorage.setItem('submissions', JSON.stringify(submissions));
            localStorage.setItem('formSubmitted', 'true');

            document.getElementById('successMessage').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';

            setTimeout(() => {
                document.getElementById('studentForm').innerHTML = '<div style="text-align: center; padding: 40px;"><h2 style="color: #667eea; margin-bottom: 20px;">✅ 제출 완료</h2><p style="color: #666; font-size: 16px; margin-bottom: 20px;">귀하의 진로 학습지가 성공적으로 제출되었습니다.</p><button class="btn-admin" style="width: 200px; padding: 12px; background: #764ba2; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;" onclick="goToAdmin()">🔐 관리자 페이지</button></div>';
            }, 1500);
        }

        function goToAdmin() {
            const password = prompt('🔐 관리자 비밀번호를 입력하세요:');
            if (password === '54321') {
                showAdminPage();
            } else if (password !== null) {
                alert('❌ 비밀번호가 틀렸습니다!');
            }
        }

        function showAdminPage() {
            const submissions = JSON.parse(localStorage.getItem('submissions') || '{}');
            let html = '<div style="background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);"><h1 style="color: #333; margin-bottom: 20px; text-align: center;">🔐 관리자 페이지</h1>';

            if (Object.keys(submissions).length === 0) {
                html += '<p style="text-align: center; color: #666; font-size: 16px; padding: 40px;">아직 제출된 학습지가 없습니다.</p>';
            } else {
                html += '<div style="margin-bottom: 20px;">';
                for (const [studentId, data] of Object.entries(submissions)) {
                    html += `<div style="background: #f9f9f9; padding: 15px; margin-bottom: 10px; border-left: 4px solid #667eea; cursor: pointer;" onclick="toggleDetails('details_${studentId}')">
                        <strong style="color: #667eea;">${data.studentId} - ${data.studentName}</strong>
                        <small style="color: #999;"> (${data.submittedAt})</small>
                    </div>
                    <div id="details_${studentId}" style="display: none; background: #f0f4ff; padding: 15px; margin-bottom: 10px; border-radius: 8px; font-size: 14px; line-height: 1.8;">
                        <p><strong>관심 분야:</strong> ${data.interest}</p>
                        <p><strong>계기:</strong> ${data.trigger}</p>
                        <p><strong>탐색 활동:</strong> ${data.activity}</p>
                        <p><strong>배운 점:</strong> ${data.learned}</p>
                        <p><strong>느낀 점:</strong> ${data.felt}</p>
                        <p style="background: #e8f0ff; padding: 10px; border-radius: 5px; margin-top: 10px;"><strong>✨ 생성된 세특:</strong><br>${data.generatedText}</p>
                    </div>`;
                }
                html += '</div>';
                html += `<button onclick="downloadExcel()" style="width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 10px;">📥 모든 데이터 엑셀 다운로드</button>`;
            }

            html += `<button onclick="location.reload()" style="width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">← 돌아가기</button></div>`;

            document.body.innerHTML = html;
        }

        function toggleDetails(id) {
            const elem = document.getElementById(id);
            elem.style.display = elem.style.display === 'none' ? 'block' : 'none';
        }

        function downloadExcel() {
            const submissions = JSON.parse(localStorage.getItem('submissions') || '{}');
            let csv = '학번,이름,관심분야,계기,탐색활동,배운점,느낀점,생성된세특,제출시간
';

            for (const [studentId, data] of Object.entries(submissions)) {
                csv += `"${data.studentId}","${data.studentName}","${data.interest}","${data.trigger}","${data.activity}","${data.learned}","${data.felt}","${data.generatedText}","${data.submittedAt}"
`;
            }

            const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `진로학습지_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }
    </script>
</body>
</html>
