<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진로 탐색 학습지</title>

<!-- =============================================== -->
<!--  ↓↓↓ 여기 두 줄만 바꾸세요 ↓↓↓                   -->
<!-- =============================================== -->
<script>
var GAS_URL   = "https://script.google.com/macros/s/AKfycbyCi2tSf9mOSExHRUcJSAZgmARCAE2BhVopmXNmiXaY7vIXTTjLNUdceo-2KAo1eY6a/exec";
var SHEET_URL = "https://docs.google.com/spreadsheets/d/14y7papVdY7xXNNjWrIHRnPHp4jh2D-4d0snxmAg7v44/edit";
var ADMIN_PW  = "54321";
</script>
<!-- =============================================== -->

<style>
*{box-sizing:border-box}
body{font-family:-apple-system,"Malgun Gothic",sans-serif;margin:0;padding:16px;background:#f4f6f8;color:#1f2937;line-height:1.6}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#6b7280;font-size:14px;margin-bottom:16px}
.card{background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:bold;font-size:15px;margin:14px 0 6px}
.hint{font-weight:normal;color:#6b7280;font-size:13px}
input,textarea,select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:6px;font-size:15px;font-family:inherit}
textarea{min-height:76px;resize:vertical}
button{width:100%;padding:14px;border:0;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:12px}
.main{background:#2563eb;color:#fff}
.sub2{background:#e5e7eb;color:#374151;font-size:14px;padding:10px}
.row{display:flex;gap:10px}
.row>div{flex:1}
#msg{display:none;padding:12px;border-radius:6px;margin-top:12px;font-size:14px}
.ok{background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7}
.ng{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5}
#out{display:none}
.pre{background:#f9fafb;border:1px solid #d1d5db;border-radius:6px;padding:12px;font-size:15px;white-space:pre-wrap}
.adm{margin-top:20px;text-align:center}
.adm a{color:#9ca3af;font-size:13px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">

  <h1>진로 탐색 학습지</h1>
  <div class="sub">아래 7개 항목을 모두 채우고 제출하세요. 제출하면 선생님께 바로 전송됩니다.</div>

  <div class="card">
    <div class="row">
      <div>
        <label>학번 <span class="hint">(예: 30112)</span></label>
        <input id="hakbun" inputmode="numeric" placeholder="30112">
      </div>
      <div>
        <label>이름</label>
        <input id="name" placeholder="홍길동">
      </div>
    </div>

    <label>1. 나의 관심 진로 분야</label>
    <input id="field" placeholder="예: 간호사, 소프트웨어 개발자, 건축가">

    <label>2. 관심을 갖게 된 계기 <span class="hint">언제, 무엇을 보고 관심이 생겼나요?</span></label>
    <textarea id="reason" placeholder="예: 2학년 때 과학 수업에서 인체 단원을 배우며 사람의 몸에 흥미를 느꼈고..."></textarea>

    <label>3. 내가 한 탐색 활동 <span class="hint">찾아본 자료, 읽은 책, 인터뷰, 체험 등</span></label>
    <textarea id="activity" placeholder="예: 직업백과에서 간호사 업무를 조사하고, 관련 다큐멘터리를 시청했으며..."></textarea>

    <label>4. 탐색을 통해 알게 된 점 <span class="hint">직업의 역할, 필요한 역량, 진학 경로 등</span></label>
    <textarea id="learned" placeholder="예: 간호사는 환자 간호뿐 아니라 의료진 간 소통이 중요하다는 것을 알게 되었고..."></textarea>

    <label>5. 느낀 점과 앞으로의 계획</label>
    <textarea id="felt" placeholder="예: 꾸준한 공부와 봉사 경험이 필요하다고 느껴 생명과학 공부에 더 집중하기로..."></textarea>

    <button class="main" onclick="submitForm()">세특 생성 후 제출하기</button>
    <div id="msg"></div>
  </div>

  <div class="card" id="out">
    <label style="margin-top:0">생성된 세특 문구 <span class="hint">(선생님께 전송된 내용)</span></label>
    <div class="pre" id="setuk"></div>
    <button class="sub2" onclick="copySetuk()">문구 복사하기</button>
  </div>

  <div class="adm"><a onclick="openAdmin()">선생님용</a></div>
</div>

<script>
function val(id){
  return document.getElementById(id).value.trim();
}

function show(text, good){
  var m = document.getElementById("msg");
  m.innerHTML = text;
  m.className = good ? "ok" : "ng";
  m.style.display = "block";
}

function makeSetuk(d){
  var s = "";
  s += "'" + d.field + "' 분야에 관심을 가지고 진로 탐색 활동에 참여함. ";
  s += d.reason + " 이를 계기로 관심 분야를 구체화함. ";
  s += "탐색 활동으로 " + d.activity + " ";
  s += "그 결과 " + d.learned + " ";
  s += "활동 소감으로 " + d.felt + " ";
  s += "자신의 진로를 주도적으로 탐색하고 구체적인 실천 계획을 세우는 모습이 돋보임.";
  return s.replace(/\s+/g, " ").trim();
}

function submitForm(){
  var d = {
    hakbun: val("hakbun"), name: val("name"), field: val("field"),
    reason: val("reason"), activity: val("activity"),
    learned: val("learned"), felt: val("felt")
  };

  var names = {hakbun:"학번", name:"이름", field:"관심 분야", reason:"계기",
               activity:"탐색 활동", learned:"알게 된 점", felt:"느낀 점"};
  var empty = [];
  for (var k in names){
    if (!d[k]) { empty.push(names[k]); }
  }
  if (empty.length > 0){
    show("다음 항목을 채워주세요 : <b>" + empty.join(", ") + "</b>", false);
    return;
  }

  d.setuk = makeSetuk(d);
  document.getElementById("setuk").innerText = d.setuk;
  document.getElementById("out").style.display = "block";

  try {
    localStorage.setItem("jinro_" + d.hakbun, JSON.stringify(d));
  } catch(e) {}

  if (GAS_URL.indexOf("http") !== 0){
    show("⚠️ 전송 주소가 설정되지 않았습니다. 선생님께 알려주세요.", false);
    return;
  }

  show("전송 중입니다...", true);

  fetch(GAS_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(d)
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    if (res && res.ok){
      show("✅ <b>제출 완료!</b> 선생님께 정상 전송되었습니다.", true);
    } else {
      show("❌ 전송 실패 : " + (res && res.error ? res.error : "알 수 없는 오류"), false);
    }
  })
  .catch(function(){
    fetch(GAS_URL, {
      method: "POST", mode: "no-cors",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(d)
    })
    .then(function(){
      show("✅ <b>제출 완료!</b> (전송함) 화면의 문구를 확인하세요.", true);
    })
    .catch(function(){
      show("❌ 인터넷 연결을 확인하고 다시 눌러주세요.", false);
    });
  });
}

function copySetuk(){
  var t = document.getElementById("setuk").innerText;
  if (navigator.clipboard){
    navigator.clipboard.writeText(t);
    alert("복사되었습니다.");
  } else {
    alert("직접 선택해서 복사해주세요.");
  }
}

function openAdmin(){
  var pw = prompt("관리자 비밀번호를 입력하세요.");
  if (pw === null) { return; }
  if (pw !== ADMIN_PW){
    alert("비밀번호가 다릅니다.");
    return;
  }
  if (SHEET_URL.indexOf("http") === 0){
    window.open(SHEET_URL, "_blank");
  } else {
    alert("구글 시트 주소가 아직 입력되지 않았습니다.\nindex.html 상단의 SHEET_URL 을 채워주세요.");
  }
}
</script>
</body>
</html>
