<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진로 학습지</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#667eea;min-height:100vh;padding:20px}
.container{max-width:760px;margin:0 auto;background:#fff;border-radius:12px;padding:28px}
h1{font-size:22px;margin-bottom:6px}
.sub{color:#666;font-size:14px;margin-bottom:20px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
button{padding:12px 18px;border:0;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer}
.primary{background:#667eea;color:#fff;width:100%;margin-top:22px}
.ghost{background:#eee;color:#333;margin-top:10px;width:100%}
.ok{display:none;background:#e7f7ed;border:1px solid #27ae60;color:#1e7e45;padding:14px;border-radius:8px;margin-top:16px;font-weight:600;text-align:center}
.hide{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.row button{flex:1}
.item{padding:10px;border:1px solid #ddd;border-radius:6px;margin-bottom:6px;cursor:pointer;background:#fafafa}
.item:hover{background:#eef1ff}
.box{border:1px solid #ddd;border-radius:8px;padding:14px;margin-top:14px;line-height:1.7;font-size:14px;white-space:pre-wrap}
.cnt{font-size:13px;color:#666;margin-bottom:10px}
</style>
</head>
<body>
<div class="container">

  <!-- 학생 화면 -->
  <div id="studentView">
    <h1>진로 학습지</h1>
    <p class="sub">모든 항목을 작성한 뒤 제출 버튼을 눌러주세요.</p>

    <label>학번 *</label>
    <input id="sid" placeholder="예) 30125">
    <label>이름 *</label>
    <input id="sname" placeholder="예) 홍길동">
    <label>관심 분야 *</label>
    <input id="field" placeholder="예) 소프트웨어 개발">
    <label>관심을 갖게 된 계기 *</label>
    <textarea id="reason"></textarea>
    <label>탐색 활동 *</label>
    <textarea id="act"></textarea>
    <label>배운 점 *</label>
    <textarea id="learn"></textarea>
    <label>느낀 점 / 앞으로의 계획 *</label>
    <textarea id="feel"></textarea>

    <button class="primary" id="btnSubmit">제출</button>
    <button class="ghost" id="btnAdmin">관리자</button>
    <div class="ok" id="okMsg">제출이 완료되었습니다. 수고했습니다!</div>
  </div>

  <!-- 관리자 화면 -->
  <div id="adminView" class="hide">
    <h1>관리자 페이지</h1>
    <p class="sub">학생을 선택하면 세특 초안이 표시됩니다.</p>
    <div class="row">
      <button class="primary" style="margin:0" id="btnExcel">엑셀 다운로드</button>
      <button class="ghost" style="margin:0" id="btnBack">학생 화면</button>
    </div>
    <div class="cnt" id="cnt"></div>
    <div id="list"></div>
    <div class="box hide" id="detail"></div>
  </div>

</div>

<script>
var KEY = 'jinro_data_v1';
var PW = '54321';

function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch(e){ return []; }
}
function save(arr){
  localStorage.setItem(KEY, JSON.stringify(arr));
}
function makeSetuk(d){
  return '진로 탐색 활동에서 ' + d.field + ' 분야에 관심을 가지게 된 계기로 ' + d.reason +
    '라고 밝힘. 이를 구체화하기 위해 ' + d.act + ' 등의 활동을 주도적으로 수행함. 활동을 통해 ' +
    d.learn + '을 알게 되었다고 정리함. 활동 후 ' + d.feel +
    '라고 소감을 밝히며 자신의 진로에 대한 구체적인 실천 의지를 드러냄.';
}
function val(id){ return document.getElementById(id).value.trim(); }

function submitForm(){
  var d = {
    sid: val('sid'), name: val('sname'), field: val('field'),
    reason: val('reason'), act: val('act'), learn: val('learn'), feel: val('feel')
  };
  for (var k in d){
    if (!d[k]){ alert('모든 항목을 작성해주세요.'); return; }
  }
  d.setuk = makeSetuk(d);
  d.time = new Date().toLocaleString('ko-KR');

  var arr = load();
  var found = -1;
  for (var i=0;i<arr.length;i++){ if (arr[i].sid === d.sid) found = i; }
  if (found >= 0) arr[found] = d; else arr.push(d);
  save(arr);

  document.getElementById('okMsg').style.display = 'block';
  window.scrollTo(0, document.body.scrollHeight);
}

function goToAdmin(){
  var p = prompt('관리자 비밀번호를 입력하세요.');
  if (p === null) return;
  if (p !== PW){ alert('비밀번호가 올바르지 않습니다.'); return; }
  document.getElementById('studentView').classList.add('hide');
  document.getElementById('adminView').classList.remove('hide');
  render();
}
function goBack(){
  document.getElementById('adminView').classList.add('hide');
  document.getElementById('studentView').classList.remove('hide');
}

function render(){
  var arr = load();
  arr.sort(function(a,b){ return a.sid > b.sid ? 1 : -1; });
  document.getElementById('cnt').textContent = '총 ' + arr.length + '명 제출';
  var box = document.getElementById('list');
  box.innerHTML = '';
  document.getElementById('detail').classList.add('hide');
  if (!arr.length){ box.innerHTML = '<p class="sub">아직 제출된 내용이 없습니다.</p>'; return; }
  for (var i=0;i<arr.length;i++){
    var div = document.createElement('div');
    div.className = 'item';
    div.textContent = arr[i].sid + ' - ' + arr[i].name + ' (' + arr[i].field + ')';
    div.setAttribute('data-sid', arr[i].sid);
    div.addEventListener('click', function(){ showDetail(this.getAttribute('data-sid')); });
    box.appendChild(div);
  }
}
function showDetail(sid){
  var arr = load(), d = null;
  for (var i=0;i<arr.length;i++){ if (arr[i].sid === sid) d = arr[i]; }
  if (!d) return;
  var el = document.getElementById('detail');
  el.textContent = '[' + d.sid + ' ' + d.name + ' / 세특 초안]\n\n' + d.setuk;
  el.classList.remove('hide');
}

function downloadExcel(){
  var arr = load();
  if (!arr.length){ alert('제출된 데이터가 없습니다.'); return; }
  var head = ['학번','이름','관심분야','계기','탐색활동','배운점','느낀점','생성된세특','제출시각'];
  var rows = [head];
  for (var i=0;i<arr.length;i++){
    var d = arr[i];
    rows.push([d.sid,d.name,d.field,d.reason,d.act,d.learn,d.feel,d.setuk,d.time]);
  }
  var csv = '';
  for (var r=0;r<rows.length;r++){
    var line = [];
    for (var c=0;c<rows[r].length;c++){
      line.push('"' + String(rows[r][c]).replace(/"/g,'""') + '"');
    }
    csv += line.join(',') + '\r\n';
  }
  var blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '진로학습지_결과.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

document.getElementById('btnSubmit').addEventListener('click', submitForm);
document.getElementById('btnAdmin').addEventListener('click', goToAdmin);
document.getElementById('btnExcel').addEventListener('click', downloadExcel);
document.getElementById('btnBack').addEventListener('click', goBack);
</script>
</body>
</html>
